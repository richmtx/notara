[package]
name = "notara"
version = "1.0.0"
description = "Notas en archivos Markdown, organizadas por carpetas"
authors = ["Ricardo Martínez"]
license = "MIT"
repository = "https://github.com/richmtx/notara"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
# `watch`: vigilar la carpeta de notas para detectar cambios hechos fuera de la app.
tauri-plugin-fs = { version = "2.5.2", features = ["watch"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-store = "2.4.5"
tauri-plugin-opener = "2.7.0"
