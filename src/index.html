<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Notara</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- El tema se aplica antes del primer pintado, para que la ventana no arranque en claro y
       salte a oscuro. La preferencia vive en los ajustes de la app; esto es solo su copia rápida. -->
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('notara-tema');
        var oscuro = tema === 'oscuro' || (tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      } catch (e) { }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>

</html>
