<app-titlebar />

<div class="contenido">
  @switch (notes.arranque()) {
    @case ('resolviendo') {
      <div class="arranque" role="status" aria-label="Cargando Notara">
        <img class="logo" src="logo.png" alt="" width="48" height="48" />
      </div>
    }
    @case ('sin-carpeta') {
      <app-welcome class="entrada" />
    }
    @case ('lista') {
      <div class="layout entrada">
        <app-sidebar />
        <app-note-list />
        <app-note-viewer />
      </div>

      @if (notes.error(); as err) {
        <p class="error-global" role="alert">{{ err }}</p>
      } @else if (notes.aviso()) {
        <p class="error-global" role="status">{{ notes.aviso() }}</p>
      }
    }
  }
</div>
