@if (!notes.carpetaRaiz()) {
  <app-welcome />
} @else {
  <div class="layout">
    <app-sidebar />
    <app-note-list />
    <app-note-viewer />
  </div>

  @if (notes.error(); as err) {
    <p class="error-global" role="alert">{{ err }}</p>
  } @else if (notes.aviso()) {
    <p class="error-global" role="status">{{ notes.aviso() }}</p>
  }
}
