<aside class="sidebar">
    <div class="marca">
        <span class="logo"></span>
        <span class="nombre">Notara</span>
    </div>

    <nav>
        <button class="item" [class.activo]="notes.enFavoritos()" (click)="notes.seleccionarCategoria(favoritos)">
            <i class="ti ti-star" aria-hidden="true"></i>
            <span class="etiqueta">Favoritos</span>
            <span class="conteo">{{ notes.totalFavoritos() }}</span>
        </button>
        <hr class="separador" />

        @for (cat of notes.categorias(); track cat.id) {
        <div class="fila" [class.eliminable]="cat.id !== sinCategoria">
            <button class="item" [class.activo]="cat.id === notes.categoriaActivaId()"
                (click)="notes.seleccionarCategoria(cat.id)">
                <i class="ti" [class]="icono(cat.icono)"></i>
                <span class="etiqueta">{{ cat.nombre }}</span>
                <span class="conteo">{{ cat.total }}</span>
            </button>
            @if (cat.id !== sinCategoria) {
            <button class="quitar" title="Eliminar categoría" [attr.aria-label]="'Eliminar la categoría ' + cat.nombre"
                (click)="pedirEliminar(cat.id)">
                <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
            }
        </div>
        @if (confirmacion()?.id === cat.id) {
        <div class="confirmar" role="group" aria-label="Confirmar eliminación de la categoría"
            (keydown.escape)="cancelarEliminar()">
            <span>{{ pregunta(cat.nombre) }}</span>
            <button #botonCancelar class="secundario" [disabled]="eliminando()"
                (click)="cancelarEliminar()">Cancelar</button>
            <button class="peligro" [disabled]="eliminando()" (click)="eliminar()">
                {{ confirmacion()?.notas ? 'Mover las notas a la papelera y eliminar' : 'Eliminar' }}
            </button>
        </div>
        }
        } @empty {
        @if (!creandoCategoria()) {
        <p class="vacio">No hay categorías en esta carpeta.</p>
        }
        }

        @if (creandoCategoria()) {
        <div class="item nueva">
            <i class="ti ti-folder" aria-hidden="true"></i>
            <input #campoCategoria type="text" aria-label="Nombre de la nueva categoría" placeholder="Nueva categoría"
                maxlength="120" spellcheck="false" (keydown.enter)="confirmarCategoria(valor($event))"
                (keydown.escape)="creandoCategoria.set(false)" (blur)="creandoCategoria.set(false)" />
        </div>
        }
    </nav>

    <footer>
        <button class="accion" [class.activo]="notes.enPapelera()" (click)="notes.seleccionarCategoria(papelera)">
            <i class="ti ti-trash" aria-hidden="true"></i>
            <span>Papelera</span>
        </button>
        <button class="accion" (click)="creandoCategoria.set(true)">
            <i class="ti ti-circle-plus"></i>
            <span>Nueva categoría</span>
        </button>
        <button class="accion" (click)="notes.elegirCarpeta()">
            <i class="ti ti-folder"></i>
            <span>Cambiar carpeta</span>
        </button>
    </footer>
</aside>
